services:
  medicloud-app:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    container_name: medicloud-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Asia/Kolkata
    volumes:
      - medicloud_data:/app/.data
    expose:
      - "3000"
    networks:
      - medicloud_net

  nginx:
    image: nginx:1.27-alpine
    container_name: medicloud-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - medicloud-app
    networks:
      - medicloud_net

volumes:
  medicloud_data:

networks:
  medicloud_net:
    driver: bridge
